name: Finance Tracker CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  test-backend:
  name: Test Spring Boot
  runs-on: ubuntu-latest

  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"
        cache: "maven"

    - name: Make mvnw executable
      working-directory: ./finance-tracker
      run: chmod +x mvnw

    - name: Run tests
      working-directory: ./finance-tracker
      run: ./mvnw --batch-mode clean test

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: spring-test-reports
        path: finance-tracker/target/surefire-reports/

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: test-backend
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Debug secrets
        env:
          U: ${{ secrets.DOCKERHUB_USERNAME }}
          T: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "Username length: ${#U}"
          echo "Token length: ${#T}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Make mvnw executable
        working-directory: ./finance-tracker
        run: chmod +x mvnw

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./finance-tracker
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/finance-tracker-backend:latest

      - name: Build and push ML service image
        uses: docker/build-push-action@v5
        with:
          context: ./ml-service
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/finance-tracker-ml:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/finance-tracker-frontend:latest

      - name: Done
        run: echo "All images pushed to Docker Hub successfully"