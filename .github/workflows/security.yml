name: Security checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run build && npm audit --audit-level=high
        working-directory: frontend
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: bash mvnw --batch-mode verify
        working-directory: finance-tracker
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-test-reports
          path: finance-tracker/target/surefire-reports/
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: OWASP dependency scan (NVD key required for reliable database refresh)
        working-directory: finance-tracker
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo '::error::Configure the NVD_API_KEY repository secret for the dependency scan.'
            exit 1
          fi
          bash mvnw --batch-mode org.owasp:dependency-check-maven:12.1.8:check -DfailBuildOnCVSS=7 -DnvdApiKeyEnvironmentVariable=NVD_API_KEY -DassemblyAnalyzerEnabled=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: finance-tracker/target/dependency-check-report.html
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan added secrets in Git history
        run: |
          mkdir -p security-reports
          docker run --rm -v "$PWD:/repo:ro" -v "$PWD/security-reports:/report" ghcr.io/gitleaks/gitleaks:v8.24.2 git /repo --config /repo/.gitleaks.toml --redact --report-format json --report-path /report/gitleaks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redacted-secret-scan
          path: security-reports/gitleaks.json
