name: Bug report
description: Report a reproducible problem using synthetic data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Do not include credentials or personal financial data. Report security vulnerabilities privately using SECURITY.md."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a small synthetic example if helpful.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Branch or commit
      placeholder: "main at commit abc1234"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and relevant output
      description: OS, browser, Docker/local startup method, and sanitized errors. Remove tokens and secret values.
