# Port your server runs on
server.port=8080

# Where is the database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/financedb}
spring.datasource.username=${DB_USERNAME:nayan}
spring.datasource.password=${DB_PASSWORD:password}
application.security.jwt.secret=${JWT_SECRET}

# Flyway manages database schema changes.
spring.jpa.hibernate.ddl-auto=validate

# Existing Finance Tracker databases already contain the V1 tables.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Show SQL queries in the console so you can see what's happening
spring.jpa.show-sql=true

# Tell hibernate which database dialect to use
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Suppress a warning about lazy loading
spring.jpa.open-in-view=false

application.security.jwt.expiration=86400000