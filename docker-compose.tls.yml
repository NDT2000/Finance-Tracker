services:
  frontend:
    ports: ["443:443"]
    volumes:
      - ./frontend/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:?TLS_CERT_DIR is required}:/etc/nginx/tls:ro
  backend:
    environment:
      COOKIE_SECURE: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS to your exact HTTPS origin}
      HIBERNATE_DDL_AUTO: validate
